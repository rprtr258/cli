version: "2"

linters:
  default: none
  enable:
    - govet
    - gocritic
  settings:
    govet:
      disable:
        # Unkeyed struct literals are fine in this codebase (internal
        # positional construction); do not flag them.
        - composites
    gocritic:
      disable-all: true
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated

formatters:
  enable:
    - gofumpt
